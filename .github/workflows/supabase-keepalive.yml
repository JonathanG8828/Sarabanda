name: Supabase Keep-Alive

on:
  schedule:
    # Ogni 6 ore (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permette l'esecuzione manuale dal tab Actions

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profili?select=id&limit=1")
          
          echo "HTTP Response code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Database contattato con successo - progetto attivo"
            exit 0
          else
            echo "❌ Errore: risposta HTTP $RESPONSE"
            exit 1
          fi
